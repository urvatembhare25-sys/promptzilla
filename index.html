<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>City Escape: Run From Kong</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* =========================
   GLOBAL STYLES
========================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: linear-gradient(to top, #1e1e2f, #2c3e50);
  overflow: hidden;
  color: white;
}

canvas {
  display: block;
  background: #87ceeb;
}

/* =========================
   UI SCREENS
========================= */
.screen {
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.5s ease;
}

.hidden {
  opacity: 0;
  pointer-events: none;
}

h1 {
  margin-bottom: 20px;
}

button {
  padding: 10px 20px;
  margin: 8px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: #3498db;
  color: white;
  font-size: 16px;
  transition: all 0.3s ease;
}

button:hover {
  background: #2980b9;
  transform: scale(1.05);
}

.selected {
  background: #e74c3c;
}

/* =========================
   HUD
========================= */
#hud {
  position: absolute;
  top: 10px;
  left: 10px;
  font-size: 18px;
  display: flex;
  gap: 20px;
}
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- =========================
     START SCREEN
========================= -->
<div id="startScreen" class="screen">
  <h1>City Escape: Run From Kong</h1>
  <p>Press SPACE to Jump</p>
  <p>Press DOWN Arrow to Duck</p>
  <div>
    <button onclick="setDifficulty('easy')" id="easyBtn">Easy</button>
    <button onclick="setDifficulty('medium')" id="mediumBtn">Medium</button>
    <button onclick="setDifficulty('hard')" id="hardBtn">Hard</button>
  </div>
  <button onclick="startGame()">Start Game</button>
</div>

<!-- =========================
     GAME OVER SCREEN
========================= -->
<div id="gameOverScreen" class="screen hidden">
  <h1>Game Over</h1>
  <p id="finalScore"></p>
  <button onclick="restartGame()">Restart</button>
  <button onclick="showStart()">Change Difficulty</button>
</div>

<div id="hud">
  <div id="scoreDisplay">Score: 0</div>
  <div id="livesDisplay">Lives: ❤️❤️❤️</div>
  <div id="difficultyDisplay">Difficulty: Easy</div>
</div>

<script>
/* =========================
   CANVAS SETUP
========================= */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* =========================
   GAME VARIABLES
========================= */
let gameRunning = false;
let obstacles = [];
let rocks = [];
let score = 0;
let lives = 3;
let maxLives = 5;
let difficulty = "easy";
let lastTime = 0;
let obstacleTimer = 0;
let rockTimer = 0;

/* =========================
   DIFFICULTY SETTINGS
========================= */
const difficultySettings = {
  easy: { speed: 4, obstacleRate: 2000, rockRate: 3000 },
  medium: { speed: 6, obstacleRate: 1500, rockRate: 2500 },
  hard: { speed: 8, obstacleRate: 1000, rockRate: 2000 }
};

function setDifficulty(level) {
  difficulty = level;
  document.querySelectorAll("button").forEach(btn => btn.classList.remove("selected"));
  document.getElementById(level + "Btn").classList.add("selected");
  document.getElementById("difficultyDisplay").innerText = "Difficulty: " + level.charAt(0).toUpperCase() + level.slice(1);
}

/* =========================
   PLAYER OBJECT
========================= */
const player = {
  x: 100,
  y: 0,
  width: 40,
  height: 60,
  velocityY: 0,
  gravity: 0.8,
  jumpPower: -15,
  isJumping: false,
  isDucking: false,
  draw() {
    ctx.fillStyle = "blue";
    ctx.fillRect(this.x, this.y, this.width, this.height);
  },
  update() {
    this.velocityY += this.gravity;
    this.y += this.velocityY;

    if (this.y + this.height >= canvas.height - 50) {
      this.y = canvas.height - 50 - this.height;
      this.velocityY = 0;
      this.isJumping = false;
    }

    if (this.isDucking) {
      this.height = 30;
    } else {
      this.height = 60;
    }
  },
  jump() {
    if (!this.isJumping) {
      this.velocityY = this.jumpPower;
      this.isJumping = true;
    }
  }
};

/* =========================
   KONG OBJECT
========================= */
const kong = {
  x: 20,
  y: 0,
  width: 80,
  height: 100,
  draw() {
    ctx.fillStyle = "brown";
    ctx.fillRect(this.x, this.y, this.width, this.height);
  }
};

/* =========================
   OBSTACLE CLASS
========================= */
class Obstacle {
  constructor() {
    this.width = 40;
    this.height = 40;
    this.x = canvas.width;
    this.y = canvas.height - 50 - this.height;
  }
  update(speed) {
    this.x -= speed;
  }
  draw() {
    ctx.fillStyle = "red";
    ctx.fillRect(this.x, this.y, this.width, this.height);
  }
}

/* =========================
   ROCK CLASS
========================= */
class Rock {
  constructor() {
    this.width = 20;
    this.height = 20;
    this.x = kong.x + kong.width;
    this.y = kong.y + 40;
  }
  update(speed) {
    this.x += speed;
    this.y += 3;
  }
  draw() {
    ctx.fillStyle = "gray";
    ctx.beginPath();
    ctx.arc(this.x, this.y, 10, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* =========================
   COLLISION DETECTION
========================= */
function isColliding(a, b) {
  return (
    a.x < b.x + b.width &&
    a.x + a.width > b.x &&
    a.y < b.y + b.height &&
    a.y + a.height > b.y
  );
}

/* =========================
   GAME LOOP
========================= */
function gameLoop(timestamp) {
  if (!gameRunning) return;

  const deltaTime = timestamp - lastTime;
  lastTime = timestamp;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Ground
  ctx.fillStyle = "#555";
  ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

  player.update();
  player.draw();

  kong.y = canvas.height - 50 - kong.height;
  kong.draw();

  const settings = difficultySettings[difficulty];

  // Obstacles
  obstacleTimer += deltaTime;
  if (obstacleTimer > settings.obstacleRate) {
    obstacles.push(new Obstacle());
    obstacleTimer = 0;
  }

  obstacles.forEach((obs, index) => {
    obs.update(settings.speed);
    obs.draw();
    if (isColliding(player, obs)) {
      loseLife();
      obstacles.splice(index, 1);
    }
  });

  // Rocks
  rockTimer += deltaTime;
  if (rockTimer > settings.rockRate) {
    rocks.push(new Rock());
    rockTimer = 0;
  }

  rocks.forEach((rock, index) => {
    rock.update(settings.speed);
    rock.draw();
    if (isColliding(player, rock)) {
      loseLife();
      rocks.splice(index, 1);
    }
  });

  // Score
  score += Math.floor(deltaTime / 10);
  document.getElementById("scoreDisplay").innerText = "Score: " + score;

  // Gain HP every 1000 points
  if (score % 1000 < 10 && lives < maxLives) {
    lives++;
  }

  updateLivesDisplay();

  requestAnimationFrame(gameLoop);
}

/* =========================
   LIFE SYSTEM
========================= */
function loseLife() {
  lives -= 1;
  if (lives <= 0) {
    endGame();
  }
}

function updateLivesDisplay() {
  let hearts = "";
  for (let i = 0; i < lives; i++) hearts += "❤️";
  document.getElementById("livesDisplay").innerText = "Lives: " + hearts;
}

/* =========================
   GAME STATE CONTROL
========================= */
function startGame() {
  document.getElementById("startScreen").classList.add("hidden");
  gameRunning = true;
  player.y = canvas.height - 50 - player.height;
  requestAnimationFrame(gameLoop);
}

function endGame() {
  gameRunning = false;
  document.getElementById("finalScore").innerText = "Final Score: " + score;
  document.getElementById("gameOverScreen").classList.remove("hidden");
}

function restartGame() {
  score = 0;
  lives = 3;
  obstacles = [];
  rocks = [];
  document.getElementById("gameOverScreen").classList.add("hidden");
  startGame();
}

function showStart() {
  document.getElementById("gameOverScreen").classList.add("hidden");
  document.getElementById("startScreen").classList.remove("hidden");
}

/* =========================
   INPUT HANDLING
========================= */
document.addEventListener("keydown", e => {
  if (e.code === "Space") player.jump();
  if (e.code === "ArrowDown") player.isDucking = true;
});
document.addEventListener("keyup", e => {
  if (e.code === "ArrowDown") player.isDucking = false;
});
</script>

</body>
</html>
